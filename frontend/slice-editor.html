<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎛️ DAW Slice Editor — ULTIMATE DUB STUDIO</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://unpkg.com/wavesurfer.js@7"></script>
    <style>
        .daw-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            background: #11111b;
            color: #cdd6f4;
        }

        .daw-header {
            background: #1e1e2e;
            padding: 15px 20px;
            border-bottom: 2px solid #45475a;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .daw-header h1 {
            margin: 0;
            font-size: 20px;
            color: #a6e3a1;
        }

        .daw-toolbar {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .daw-main {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        .daw-sidebar {
            width: 250px;
            background: #1e1e2e;
            border-right: 2px solid #45475a;
            overflow-y: auto;
            padding: 15px;
        }

        .daw-editor {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .waveform-container {
            flex: 1;
            background: #11111b;
            border: 1px solid #45475a;
            margin: 15px;
            border-radius: 8px;
            overflow: hidden;
            position: relative;
        }

        #waveform {
            width: 100%;
            height: 100%;
        }

        .controls-panel {
            background: #1e1e2e;
            padding: 15px 20px;
            border-top: 2px solid #45475a;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .control-group label {
            font-size: 12px;
            color: #89dceb;
            font-weight: 600;
            text-transform: uppercase;
        }

        .control-row {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .btn-icon {
            width: 40px;
            height: 40px;
            padding: 0;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            background: #313244;
            border: 1px solid #45475a;
            border-radius: 4px;
            color: #cdd6f4;
            transition: all 0.2s;
        }

        .btn-icon:hover {
            background: #45475a;
            border-color: #89dceb;
        }

        .btn-icon.active {
            background: #a6e3a1;
            color: #11111b;
        }

        .speed-control {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .speed-display {
            min-width: 50px;
            text-align: center;
            font-weight: bold;
            color: #fab387;
        }

        .chunk-list {
            max-height: 400px;
            overflow-y: auto;
        }

        .chunk-item {
            padding: 10px;
            margin-bottom: 8px;
            background: #313244;
            border-left: 3px solid #45475a;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 12px;
        }

        .chunk-item:hover {
            background: #45475a;
            border-left-color: #89dceb;
        }

        .chunk-item.active {
            background: #a6e3a1;
            color: #11111b;
            border-left-color: #a6e3a1;
        }

        .chunk-info {
            font-size: 11px;
            color: #bac2de;
            margin-top: 4px;
        }

        .history-stack {
            margin-top: 20px;
            padding-top: 15px;
            border-top: 1px solid #45475a;
        }

        .history-item {
            padding: 6px;
            font-size: 11px;
            background: #313244;
            margin-bottom: 4px;
            border-radius: 3px;
            cursor: pointer;
            color: #bac2de;
        }

        .history-item:hover {
            background: #45475a;
        }

        .history-item.current {
            background: #a6e3a1;
            color: #11111b;
            font-weight: bold;
        }

        .mode-indicator {
            padding: 8px 12px;
            background: #313244;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 600;
            color: #cdd6f4;
        }

        .mode-indicator.manual {
            background: #fab387;
            color: #11111b;
        }

        .playback-info {
            display: flex;
            justify-content: space-between;
            padding: 10px;
            background: #313244;
            border-radius: 4px;
            font-size: 13px;
            margin-bottom: 10px;
        }

        .time-display {
            font-family: 'Courier New', monospace;
            font-weight: bold;
            color: #a6e3a1;
        }

        .slice-marker {
            position: absolute;
            width: 2px;
            height: 100%;
            background: #f38ba8;
            opacity: 0.8;
            cursor: col-resize;
            z-index: 10;
        }

        .slice-marker.manual {
            background: #fab387;
            width: 3px;
        }

        .status-bar {
            background: #313244;
            padding: 10px 20px;
            border-top: 1px solid #45475a;
            font-size: 12px;
            color: #bac2de;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .status-item {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background: #1e1e2e;
            padding: 30px;
            border-radius: 8px;
            max-width: 500px;
            width: 90%;
        }

        .modal-content h2 {
            margin-top: 0;
            color: #a6e3a1;
        }
    </style>
</head>
<body style="margin: 0; padding: 0;">

    <div class="daw-container">
        <!-- Header -->
        <div class="daw-header">
            <h1>🎛️ DAW Slice Editor</h1>
            <div class="daw-toolbar">
                <button class="btn btn-outline" onclick="window.location.href='index.html'">← Back to Dashboard</button>
                <button class="btn btn-blue" onclick="syncSliceState()">🔄 Sync State</button>
                <button class="btn btn-green" onclick="saveSliceChanges()">💾 Save & Apply</button>
            </div>
        </div>

        <!-- Main Content -->
        <div class="daw-main">
            <!-- Left Sidebar -->
            <div class="daw-sidebar">
                <div class="playback-info">
                    <span>Current Time:</span>
                    <span class="time-display" id="current-time">00:00.00</span>
                </div>

                <div class="control-group">
                    <label>Playback Speed</label>
                    <div class="speed-control">
                        <button class="btn-icon" onclick="changeSpeed(-0.1)">🔽</button>
                        <span class="speed-display" id="speed-value">1.0x</span>
                        <button class="btn-icon" onclick="changeSpeed(0.1)">🔼</button>
                    </div>
                    <input type="range" id="speed-slider" min="0.25" max="2.0" step="0.05" value="1.0" 
                           oninput="setSpeed(this.value)" style="width: 100%;">
                </div>

                <div class="control-group" style="margin-top: 20px;">
                    <label>Audio Volume</label>
                    <input type="range" id="volume-slider" min="0" max="1" step="0.05" value="1" 
                           oninput="setVolume(this.value)" style="width: 100%;">
                </div>

                <div class="control-group" style="margin-top: 20px;">
                    <label>Mode</label>
                    <div class="mode-indicator" id="mode-indicator">AUTO</div>
                </div>

                <div class="chunk-list">
                    <label style="font-size: 12px; color: #89dceb; font-weight: 600; text-transform: uppercase;">Chunks</label>
                    <div id="chunk-list-container"></div>
                </div>

                <div class="history-stack">
                    <label style="font-size: 12px; color: #89dceb; font-weight: 600; text-transform: uppercase;">Edit History</label>
                    <div id="history-container"></div>
                </div>
            </div>

            <!-- Main Editor -->
            <div class="daw-editor">
                <!-- Waveform -->
                <div class="waveform-container" id="waveform-wrapper">
                    <div id="waveform"></div>
                </div>

                <!-- Controls -->
                <div class="controls-panel">
                    <div class="control-group">
                        <label>Playback</label>
                        <div class="control-row">
                            <button class="btn-icon" id="btn-play" onclick="togglePlay()" title="Play/Pause">▶</button>
                            <button class="btn-icon" onclick="stopPlayback()" title="Stop">⏹</button>
                            <button class="btn-icon" onclick="skipToStart()" title="Start">⏮</button>
                            <button class="btn-icon" onclick="skipToEnd()" title="End">⏭</button>
                        </div>
                    </div>

                    <div class="control-group">
                        <label>Slice Tools</label>
                        <div class="control-row">
                            <button class="btn-icon" id="btn-slice" onclick="toggleSliceMode()" title="Add Slice Point">✂️</button>
                            <button class="btn-icon" onclick="splitAtCursor()" title="Split Chunk">🔀</button>
                            <button class="btn-icon" onclick="mergeChunks()" title="Merge Chunks">🔗</button>
                        </div>
                    </div>

                    <div class="control-group">
                        <label>Edit Actions</label>
                        <div class="control-row">
                            <button class="btn-icon" onclick="undoEdit()" title="Undo">↶</button>
                            <button class="btn-icon" onclick="redoEdit()" title="Redo">↷</button>
                            <button class="btn-icon" onclick="resetSlices()" title="Reset to Auto">🔄</button>
                        </div>
                    </div>

                    <div class="control-group">
                        <label>Zoom</label>
                        <div class="control-row">
                            <button class="btn-icon" onclick="zoomOut()">🔍-</button>
                            <input type="range" id="zoom-slider" min="1" max="10" step="0.5" value="1" 
                                   oninput="setZoom(this.value)" style="width: 100px;">
                            <button class="btn-icon" onclick="zoomIn()">🔍+</button>
                        </div>
                    </div>
                </div>

                <!-- Status Bar -->
                <div class="status-bar">
                    <div class="status-item">
                        <span id="status-chunks">Chunks: 0</span>
                        <span id="status-duration">Duration: 00:00</span>
                        <span id="status-mode">Mode: AUTO</span>
                    </div>
                    <div class="status-item">
                        <span id="status-unsaved" style="color: #f38ba8; display: none;">⚠️ Unsaved Changes</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Confirmation Modal -->
    <div class="modal-overlay" id="confirm-modal">
        <div class="modal-content">
            <h2 id="modal-title">Confirm Action</h2>
            <p id="modal-message"></p>
            <div style="display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px;">
                <button class="btn btn-outline" onclick="closeModal()">Cancel</button>
                <button class="btn btn-green" id="modal-confirm-btn" onclick="confirmAction()">Confirm</button>
            </div>
        </div>
    </div>

    <script src="slice-editor.js"></script>
</body>
</html>
